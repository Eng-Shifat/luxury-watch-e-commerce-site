<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Orders | Rolex Watch</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23e58430'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23fff' stroke-width='1.5'/%3E%3Cline x1='32' y1='32' x2='32' y2='22' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='32' y1='32' x2='40' y2='32' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3Crect x='28' y='10' width='8' height='5' rx='1' fill='%23fff'/%3E%3Crect x='28' y='49' width='8' height='5' rx='1' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="ad-header">
  <a href="index.html" class="ad-logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <circle cx="12" cy="12" r="7"/>
      <polyline points="12 9 12 12 13.5 13.5"/>
      <path d="M16.51 17.35l-.35 3.83a2 2 0 01-1.99 1.82H9.83a2 2 0 01-1.99-1.82l-.35-3.83m.01-10.7l.35-3.83A2 2 0 019.83 1h4.35a2 2 0 011.99 1.82l.35 3.83"/>
    </svg>
    Rolex <span class="ad-logo-sub">Admin</span>
  </a>
  <a href="index.html" class="ad-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back to Store
  </a>
</header>

<!-- ===== MAIN ===== -->
<main class="ad-main">

  <h1 class="ad-title">Orders</h1>

  <!-- Stat cards -->
  <div class="ad-stats">
    <div class="ad-stat-card">
      <span class="ad-stat-label">Total Orders</span>
      <span class="ad-stat-value" id="ad-stat-total">0</span>
    </div>
    <div class="ad-stat-card">
      <span class="ad-stat-label">Pending</span>
      <span class="ad-stat-value" id="ad-stat-pending">0</span>
    </div>
    <div class="ad-stat-card">
      <span class="ad-stat-label">Delivered</span>
      <span class="ad-stat-value" id="ad-stat-delivered">0</span>
    </div>
    <div class="ad-stat-card">
      <span class="ad-stat-label">Total Revenue</span>
      <span class="ad-stat-value" id="ad-stat-revenue">$0</span>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="ad-toolbar">
    <input type="text" id="ad-search" class="ad-search" placeholder="Order ID, name বা phone দিয়ে search করো…">
    <select id="ad-status-filter" class="ad-filter">
      <option value="all">All statuses</option>
      <option value="Pending">Pending</option>
      <option value="Confirmed">Confirmed</option>
      <option value="Shipped">Shipped</option>
      <option value="Delivered">Delivered</option>
      <option value="Cancelled">Cancelled</option>
    </select>
  </div>

  <!-- Empty state -->
  <div class="ad-empty" id="ad-empty">
    <p>এখনো কোনো order আসেনি।</p>
  </div>

  <!-- Orders table -->
  <div class="ad-table-wrap" id="ad-table-wrap">
    <table class="ad-table">
      <thead>
        <tr>
          <th>Order</th>
          <th>Customer</th>
          <th>Items</th>
          <th>Shipping</th>
          <th>Payment</th>
          <th>Total</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="ad-table-body"></tbody>
    </table>
  </div>

</main>

<!-- ===== ORDER DETAIL MODAL ===== -->
<div class="ad-modal-overlay" id="ad-modal-overlay" onclick="closeOrderModal(event)">
  <div class="ad-modal" onclick="event.stopPropagation()">
    <button class="ad-modal-close" onclick="closeOrderModal()">✕</button>
    <div id="ad-modal-body"></div>
  </div>
</div>

<script src="js/orders-store.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
